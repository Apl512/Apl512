<svg xmlns="http://www.w3.org/2000/svg" width="900" height="230" viewBox="0 0 900 230">
  <defs>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="1" fill="#000" fill-opacity="0.3"/>
    </pattern>
    <style>
      .mono { font-family: 'Courier New', Consolas, monospace; font-size: 17px; }
      .l { opacity: 0; animation: show 0.01s forwards; }
      .l1 { animation-delay: 0.3s; }
      .l2 { animation-delay: 1.0s; }
      .l3 { animation-delay: 1.7s; }
      .l4 { animation-delay: 2.4s; }
      .l5 { animation-delay: 3.1s; }
      .l6 { animation-delay: 3.8s; }
      @keyframes show { to { opacity: 1; } }
      .cursor { animation: blink 1s infinite steps(1); }
      @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
      .ok { animation: pulse 1.6s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: 1; } }
    </style>
  </defs>

  <rect width="900" height="230" rx="6" fill="#0a0a12"/>
  <rect width="900" height="34" rx="6" fill="#14142a"/>
  <rect y="28" width="900" height="6" fill="#14142a"/>
  <circle cx="22" cy="17" r="6" fill="#ff2a6d"/>
  <circle cx="44" cy="17" r="6" fill="#f9f002"/>
  <circle cx="66" cy="17" r="6" fill="#00f0ff"/>
  <text x="450" y="22" text-anchor="middle" class="mono" style="font-size:13px" fill="#6b6b9a">adam@cyberdeck:~</text>

  <g class="mono">
    <text x="24" y="70"  class="l l1"><tspan fill="#00f0ff">$</tspan><tspan fill="#ffffff"> whoami</tspan></text>
    <text x="24" y="92"  class="l l1" fill="#ff2a6d">  adam_puche_lioubavina</text>

    <text x="24" y="122" class="l l2"><tspan fill="#00f0ff">$</tspan><tspan fill="#ffffff"> cat role.txt</tspan></text>
    <text x="24" y="144" class="l l3" fill="#f9f002">  HND in Computing Student | Software Developer | Game Dev Enthusiast</text>

    <text x="24" y="172" class="l l4"><tspan fill="#00f0ff">$</tspan><tspan fill="#ffffff"> ./focus --list</tspan></text>
    <text x="24" y="194" class="l l5" fill="#ff2a6d">  [game engines] [graphics APIs] [build systems] [low-level code]</text>

    <text x="24" y="219" class="l l6"><tspan fill="#00f0ff">$</tspan><tspan fill="#39ff14" class="ok"> status: ONLINE</tspan><tspan fill="#00f0ff" class="cursor"> _</tspan></text>
  </g>

  <rect width="900" height="230" rx="6" fill="url(#scan)"/>
  <rect x="1" y="1" width="898" height="228" rx="6" fill="none" stroke="#00f0ff" stroke-opacity="0.5"/>
</svg>
