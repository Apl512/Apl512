<svg xmlns="http://www.w3.org/2000/svg" width="900" height="54" viewBox="0 0 900 54">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00f0ff"/>
      <stop offset="1" stop-color="#ff2a6d"/>
    </linearGradient>
    <style>
      .t { font-family: 'Courier New', Consolas, monospace; font-weight: bold; font-size: 24px; letter-spacing: 3px; }
      .glow { animation: glow 2.4s ease-in-out infinite; }
      @keyframes glow { 0%, 100% { opacity: .6; } 50% { opacity: 1; } }
    </style>
  </defs>
  <polygon points="0,6 880,6 900,26 900,48 0,48" fill="#0a0a12" stroke="#00f0ff" stroke-opacity="0.45"/>
  <rect x="0" y="6" width="6" height="42" fill="#ff2a6d" class="glow"/>
  <text x="26" y="36" class="t" fill="#00f0ff">// 02 :: OPEN_CHANNEL</text>
  <rect x="0" y="50" width="900" height="3" fill="url(#line)" class="glow"/>
</svg>
